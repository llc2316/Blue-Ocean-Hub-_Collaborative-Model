# 4.7 输出模块公开代理参数
# 说明：
# - 这是公开基准参数，不是项目实测或合同口径。
# - 数值用于接口联调、示例和追溯。
# - 正式工程结论前必须替换为厂家、SCADA、合同或审批后的公共参数。

说明:
  数据性质: 公共代理数据
  参考地点: 广东近海公共参考点
  覆盖时间: 2025-06-01T00:00Z 到 2025-06-07T23:00Z
  时间步长_h: 1.0
  数据来源网址:
    - https://power.larc.nasa.gov/docs/services/api/temporal/hourly/
    - https://open-meteo.com/en/docs/marine-weather-api

metadata:
  reference_site_id: GD_OFFSHORE_PUBLIC_PROXY
  latitude_deg: 21.5
  longitude_deg: 114.5
  period_utc: 2025-06-01T00:00Z/2025-06-07T23:00Z
  timestep_h: 1.0
  generated_from:
    - nasa_power_hourly_gd_offshore_20250601_20250607_utc.csv
    - open_meteo_marine_gd_offshore_20250601_20250607.csv

bridge_defaults:
  cable_cap_mw: 700.0
  grid_cap_mw: 450.0
  cable_loss_fraction: 0.08
  pipe_cap_kg_per_h: 1800.0
  ship_cap_kg_per_h: 1200.0
  pipe_loss_fraction: 0.01
  ship_loss_fraction: 0.02
  marine_base_mw: 8.0
  marine_desal_mw: 4.0
  marine_equipment_mw: 6.0
  marine_flexible_fraction: 0.30

derived_signal_assumptions:
  wind_capacity_mw: 34.0
  pv_capacity_mw: 4.0
  wind_cut_in_m_s: 3.0
  wind_rated_m_s: 12.0
  wind_cut_out_m_s: 25.0
  sec_kwh_per_kg_h2: 56.77
  h2_storage_initial_kg: 30000.0
  h2_storage_max_kg: 72000.0
  h2_delivery_request_kg_per_h: 500.0
  compute_delivery_cap_mwh_cs_per_h: 120.0
